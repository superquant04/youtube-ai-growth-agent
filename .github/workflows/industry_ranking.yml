name: AI Industry Reversal Ranking

# 평일 미국 장 마감 후 UTC 21:30 (= KST 다음날 오전 6:30)에 랭킹 스냅샷을 수집해 순위 히스토리를 쌓습니다.
# 대시보드 산업 상세의 참고용 AI 뉴스 추이(GDELT, 약 2~3분 소요)도 함께 갱신합니다. 뉴스는 점수에 들어가지 않습니다.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:      # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write         # 스냅샷 DB를 저장소에 커밋하기 위해 필요

concurrency:
  group: industry-ranking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 시장 데이터 수집 및 랭킹 계산 (+ 참고용 뉴스 추이)
        run: python -m ai_industry_ranking.collect --refresh-news

      - name: 스냅샷 DB 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai_industry_ranking/industry_ranking.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: AI 반전 산업 랭킹 스냅샷 ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
